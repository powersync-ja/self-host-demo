# Convex + PowerSync Self-Hosted Demo
#
# Starts a self-hosted Convex backend, pushes functions, configures JWT auth,
# runs a PowerSync service with the Convex connector, and serves the React
# todo-list demo app.
#
# Usage:
#   docker compose -f demos/convex/docker-compose.yaml up
#
# Or from this directory:
#   docker compose up

services:
  # ── Convex Backend ──────────────────────────────────────────────────────────
  backend:
    image: ghcr.io/get-convex/convex-backend:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_PORT:-3210}:3210"
      - "${CONVEX_SITE_PORT:-3211}:3211"
    volumes:
      - convex_data:/convex/data
    environment:
      - CONVEX_CLOUD_ORIGIN=http://127.0.0.1:${CONVEX_PORT:-3210}
      - CONVEX_SITE_ORIGIN=http://127.0.0.1:${CONVEX_SITE_PORT:-3211}
      - RUST_LOG=${RUST_LOG:-info}
    healthcheck:
      test: curl -f http://localhost:3210/version
      interval: 5s
      start_period: 10s

  # ── Convex Dashboard ────────────────────────────────────────────────────────
  dashboard:
    image: ghcr.io/get-convex/convex-dashboard:latest
    stop_grace_period: 10s
    stop_signal: SIGINT
    ports:
      - "${CONVEX_DASHBOARD_PORT:-6791}:6791"
    environment:
      - NEXT_PUBLIC_DEPLOYMENT_URL=http://127.0.0.1:${CONVEX_PORT:-3210}
    depends_on:
      backend:
        condition: service_healthy

  # ── Admin Key Generator ─────────────────────────────────────────────────────
  # Runs generate_admin_key.sh from the backend image using the shared data
  # volume, then writes the deploy key to a shared setup volume.
  convex-keygen:
    image: ghcr.io/get-convex/convex-backend:latest
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - convex_data:/convex/data
      - setup_data:/setup
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Generating admin key..."
        ./generate_admin_key.sh > /setup/admin_key 2>&1
        grep -v '^[[:space:]]*$' /setup/admin_key | tail -1 | tr -d '\r\n' > /setup/deploy_key
        echo "Admin key generated"

  # ── Convex Setup (push functions + configure JWT) ───────────────────────────
  # Reads the admin key, pushes Convex functions, and sets JWT_PRIVATE_KEY + JWKS.
  convex-setup:
    build:
      # TODO: Replace with the public Git repository URL when it is ready.
      # The Convex backend source is fetched from the demo
      context: https://github.com:powersync-community/powersync-convex-todolist-demo.git#demo-dockerfile
    entrypoint: ["/bin/sh", "/convex-backend/entrypoint.sh"]
    depends_on:
      convex-keygen:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    volumes:
      - setup_data:/setup
      - ./convex-backend/:/convex-backend
    environment:
      CONVEX_SELF_HOSTED_URL: http://backend:3210

  # ── MongoDB (PowerSync bucket storage) ──────────────────────────────────────
  mongo:
    image: mongo:7.0
    command: --replSet rs0 --bind_ip_all --quiet
    restart: unless-stopped
    volumes:
      - mongo_storage:/data/db
    ports:
      - 27017:27017

  mongo-rs-init:
    image: mongo:7.0
    depends_on:
      - mongo
    restart: on-failure
    entrypoint: ["bash", "-c"]
    command:
      - |
        mongosh --host mongo:27017 --eval 'try{rs.status().ok&&quit(0)}catch{} rs.initiate({_id:"rs0",members:[{_id:0,host:"mongo:27017"}]})'

  # ── PowerSync Service ───────────────────────────────────────────────────────
  powersync:
    image: journeyapps/powersync-service:0.0.0-dev-20260514153539
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        export PS_CONVEX_DEPLOY_KEY="$$(cat /setup/deploy_key)"
        exec node service/lib/entry.js start -r unified
    depends_on:
      convex-setup:
        condition: service_completed_successfully
      mongo-rs-init:
        condition: service_completed_successfully
    volumes:
      - ./powersync:/config
      - setup_data:/setup
    environment:
      POWERSYNC_CONFIG_PATH: /config/service.yaml
      NODE_OPTIONS: --max-old-space-size=1000
      PS_MONGO_URI: mongodb://mongo:27017/powersync_convex?directConnection=true
      PS_PORT: ${PS_PORT:-8080}
      PS_JWKS_URL: http://backend:3211/.well-known/jwks.json
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:8080/probes/liveness').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 1s
      retries: 15
    ports:
      - "${PS_PORT:-8080}:8080"

  # ── React Demo Client ───────────────────────────────────────────────────────
  demo-client:
    build:
      # TODO: Update branch once merged
      context: https://github.com:powersync-community/powersync-convex-todolist-demo.git#demo-dockerfile
      dockerfile: Dockerfile
      args:
        VITE_CONVEX_URL: http://127.0.0.1:${CONVEX_PORT:-3210}
        VITE_POWERSYNC_URL: http://localhost:${PS_PORT:-8080}
    ports:
      - "${DEMO_CLIENT_PORT:-3030}:4173"
    depends_on:
      powersync:
        condition: service_healthy

volumes:
  convex_data:
  setup_data:
  mongo_storage:
