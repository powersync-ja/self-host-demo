# Adds YAML Schema support for VS Code users with the YAML extension installed.
# This enables validation and autocompletion based on the PowerSync sync rules schema.
# yaml-language-server: $schema=https://unpkg.com/@powersync/service-sync-rules@latest/schema/sync_rules.json

# See https://docs.powersync.com/sync/advanced/compatibility
config:
  edition: 3

streams:
  user_lists:
    # AUTO-SUBSCRIBE: always synced for the logged-in user.
    auto_subscribe: true
    # Convex Auth JWT subjects contain `[32 character user ID]|[user session ID]`.
    # `auth.user_id()` returns the full subject, so the sync rule extracts the
    # Convex user ID prefix before comparing it to list ownership.
    #
    # PowerSync uses the selected `id` column as the local row ID. The demo app
    # stores a stable local-first UUID in `uuid`, while Convex keeps its own `_id`.
    query: SELECT uuid AS id, * FROM lists WHERE owner_id = substring(auth.user_id(), 1, 32)

  user_todos:
    # Sync todos only for lists owned by the logged-in user. Todos reference
    # their parent list through the same local-first `list_uuid` used by the app.
    auto_subscribe: true
    query: SELECT uuid AS id, * FROM todos WHERE list_uuid IN (SELECT uuid FROM lists WHERE owner_id = substring(auth.user_id(), 1, 32))
